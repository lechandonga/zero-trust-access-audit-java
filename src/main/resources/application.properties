server.port=8080

# Local zero-trust access & audit configuration.
# Credential lifetime and tolerated clock skew (milliseconds).
ztaa.credential.ttl-millis=3600000
ztaa.credential.clock-skew-millis=60000
# Retired signing keys stay verification-only for this long after rotation.
ztaa.key.grace-millis=600000
# Bootstrap management token. Leave empty to generate one at startup (printed once).
ztaa.admin-token=${ZTAA_ADMIN_TOKEN:}

logging.level.com.github.lechandonga=INFO
logging.level.ztaa.audit=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger] %msg%n
